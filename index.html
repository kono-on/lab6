<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCT360 Lab 6</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main container and title elements. -->
    <div class="content">
    <h1> Currency Exchange Converter</h1>

     <div class="hud">
        <!-- Each panel, representing a value or action. -->
        <div class="item">
            <input id="inputbox" placeholder="Type the amount to convert.">
        </div>
        <div class="item">
            Currency:
            <select id="currency1"></select>
        </div>
        <div class="item">
            Convert To:
                <select id="currency2"></select>
        </div>
        <div class="item pressable" id="submit">Submit</div>
        <div class="item" id="result">Result: </div>
        <div class="item pressable" id="swap">Swap</div>
    </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
